version: '3.8'

services:
  order-service:
    build:
      context: ./order-service
    container_name: order-service
    ports:
      - "8085:8085"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://shared-postgres:5432/order_service_db
    networks:
      - ss2_e-learning-net

  user-service:
    build:
      context: ./user-service
    container_name: homework-user-service
    ports:
      - "8086:8086"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://shared-postgres:5432/user_db
    networks:
      - ss2_e-learning-net

  inventory-service:
    build:
      context: ./inventory-service
    container_name: homework-inventory-service
    ports:
      - "8087:8087"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://shared-postgres:5432/inventory_db
    networks:
      - ss2_e-learning-net

networks:
  ss2_e-learning-net:
    external: true